<!DOCTYPE html>
<html>
    <head>
        <title>Anlamsal ile Web sayfası</title>
        <style>
           body{
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
           } 

            header{
                width: 1000px;
                border: 1px dotted darkblue;
                height: 60px;
                background-color: rgb(179, 155, 111);
                text-align: center;
                line-height: 60px;
            }

            nav{
                width: 1000px;
                border: 1px dotted darkblue;
                height: 60px;
                background-color: rgb(21, 96, 131);
                text-align: center;
                line-height: 60px;
                float: left;
                margin-top: 5px;
            }

            section{
                width: 1000px;
                border: 1px dotted darkblue;
                height: 400px;
                background-color: #B39B6F;
                text-align: center;
                line-height: 60px;
                margin-top: 5px;
            }

            section header{
                width: 700px;
                border: 1px dotted darkblue;
                height: 100px;
                background-color: #156083;
                text-align: center;
                line-height: 60px;
                margin: 10px auto;
            }

            section article{
                width: 700px;
                border: 1px dotted darkblue;
                height: 100px;
                background-color:  #a01919;
                text-align: center;
                line-height: 60px;
                margin: auto auto;
            }

            footer{
                width: 1000px;
                border: 1px dotted rgb(250, 195, 14);
                height: 100px;
                background-color:  #3217ce;
                text-align: center;
                line-height: 60px;
                float: left;
                margin-top: 5px;
            }

        </style>
    </head>
    <body>
        <header>Bonibon Ayırma Makinası Projesi</header>
        <nav>Projemiz Farklı Renkli Bonibonları Ayırma Makinasıdır</nav>
        <section>Proje
            <header>Bonibon Makinamız İçin gerekli Malzemeler</header>
            <article>Malzemeler Renk sensörü, Esp 32 Yada Ardinio Uno, Motor</article>
        </section>
        <footer>Ömer Faruk Pelenk</footer>
    </body>
</html>
